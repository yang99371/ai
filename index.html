<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI 起名 · 三组方案与寓意</title>
<meta name="description" content="输入需求，让 AI 现场给出三组有寓意、有风格区分度的名字方案。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6f63'/%3E%3Ctext x='16' y='23' font-size='18' font-family='serif' fill='%23ffffff' text-anchor='middle'%3E%E5%90%8C%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --paper: #f6f4ef;
    --paper-2: #fffdf8;
    --ink: #1c1b18;
    --ink-2: #4a4740;
    --ink-3: #8a857a;
    --line: #e3ddd1;
    --jade: #0f6f63;
    --jade-soft: #e6f1ee;
    --amber: #b06a12;
    --danger: #a3342a;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(30, 26, 18, .05), 0 12px 30px -18px rgba(30, 26, 18, .25);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1100px 620px at 82% -12%, #eef5f2 0%, rgba(238, 245, 242, 0) 62%),
      radial-gradient(900px 520px at -8% 108%, #faf1e3 0%, rgba(250, 241, 227, 0) 60%),
      var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
  }

  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 40px 20px 72px;
  }

  header.top { margin-bottom: 28px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--jade);
    background: var(--jade-soft);
    border: 1px solid #cfe4de;
    padding: 5px 11px;
    border-radius: 999px;
  }

  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--jade);
    box-shadow: 0 0 0 3px rgba(15, 111, 99, .12);
  }

  h1 {
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.22;
    letter-spacing: -.02em;
    margin: 16px 0 8px;
    font-weight: 700;
  }

  h1 .accent { color: var(--jade); }

  .sub {
    margin: 0;
    color: var(--ink-3);
    font-size: 14.5px;
    max-width: 62ch;
  }

  .grid {
    display: grid;
    grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
    margin-top: 30px;
  }

  .panel {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .panel-form { padding: 22px; position: sticky; top: 24px; }

  label.field-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    margin-bottom: 9px;
  }

  .counter { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .api-badge {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--ink-3);
    background: #f3f0e8;
    border: 1px solid #e6dfd1;
    border-radius: 999px;
    padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }

  .api-badge.warn { color: var(--amber); background: #fbf1e3; border-color: #eddcc2; }

  .select-wrap { position: relative; }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 38px 11px 13px;
    cursor: pointer;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }

  select:focus { border-color: #a9cdc5; box-shadow: 0 0 0 3px rgba(15, 111, 99, .1); }
  select:disabled { opacity: .6; cursor: not-allowed; }

  .select-arrow {
    position: absolute;
    right: 15px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 1.5px solid var(--ink-3);
    border-bottom: 1.5px solid var(--ink-3);
    transform: translateY(-72%) rotate(45deg);
    pointer-events: none;
  }

  textarea {
    width: 100%;
    min-height: 148px;
    resize: vertical;
    padding: 13px 14px;
    font: inherit;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }

  textarea::placeholder { color: #a9a29a; }

  textarea:focus {
    border-color: #a9cdc5;
    box-shadow: 0 0 0 3px rgba(15, 111, 99, .1);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }

  .chip {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink-2);
    background: #f3f0e8;
    border: 1px solid #e6dfd1;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all .16s;
  }

  .chip:hover { background: var(--jade-soft); border-color: #cfe4de; color: var(--jade); }

  .actions { display: flex; gap: 10px; margin-top: 18px; }

  button.primary {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--jade);
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;
    cursor: pointer;
    transition: transform .14s, background .18s, opacity .18s;
  }

  button.primary:hover { background: #0c5d53; }
  button.primary:active { transform: translateY(1px); }
  button.primary[disabled] { opacity: .62; cursor: not-allowed; transform: none; }

  button.ghost {
    font: inherit;
    font-size: 14px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    cursor: pointer;
    transition: all .16s;
    white-space: nowrap;
  }

  button.ghost:hover:not([disabled]) { border-color: #c9c0b0; color: var(--ink); }
  button.ghost[disabled] { opacity: .45; cursor: not-allowed; }

  .hint {
    margin-top: 16px;
    padding-top: 15px;
    border-top: 1px dashed var(--line);
    font-size: 12.5px;
    color: var(--ink-3);
    line-height: 1.65;
  }

  .hint b { color: var(--ink-2); font-weight: 600; }

  /* ---- 输出区 ---- */
  .panel-out { min-height: 440px; display: flex; flex-direction: column; }

  .out-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }

  .out-title { font-size: 13.5px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .status .dot { background: #b7b1a5; box-shadow: none; transition: background .2s; }
  .status.live .dot { background: var(--jade); box-shadow: 0 0 0 3px rgba(15, 111, 99, .14); animation: pulse 1.4s ease-in-out infinite; }
  .status.err .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(163, 52, 42, .14); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .out-body { flex: 1; padding: 26px 24px 30px; position: relative; overflow-wrap: anywhere; }

  .empty {
    height: 100%;
    min-height: 330px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    color: var(--ink-3);
  }

  .empty-mark {
    width: 58px; height: 58px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: var(--jade-soft);
    color: var(--jade);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.04em;
    border: 1px solid #d5e8e3;
  }

  .empty p { margin: 0; font-size: 13.5px; }

  #output h3 {
    margin: 26px 0 10px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--ink);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #output h3:first-child { margin-top: 0; }

  #output h3::before {
    content: "";
    width: 3px; height: 15px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--jade), #43a08f);
    flex: none;
  }

  #output p { margin: 9px 0; font-size: 14.8px; color: var(--ink-2); }

  #output strong { color: var(--ink); font-weight: 650; }

  #output ul { margin: 9px 0; padding-left: 20px; }
  #output li { font-size: 14.8px; color: var(--ink-2); margin: 4px 0; }

  #output p:last-child { margin-bottom: 0; }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--jade);
    opacity: .85;
    border-radius: 2px;
    animation: blink .95s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .out-foot {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 13px 20px;
    border-top: 1px solid var(--line);
    background: #fbf9f3;
    border-radius: 0 0 var(--radius) var(--radius);
    font-size: 12px;
    color: var(--ink-3);
  }

  .out-foot.show { display: flex; }

  .foot-actions { display: flex; gap: 8px; }

  .mini {
    font: inherit;
    font-size: 12px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all .16s;
  }

  .mini:hover { border-color: #c9c0b0; color: var(--ink); }

  .banner {
    margin: 0 0 18px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    border: 1px solid #eed3cd;
    background: #fdf3f1;
    color: #7d2b22;
  }

  /* 错误态里展示的原始技术详情（仅未知错误才出现） */
  .tech-detail {
    margin: 4px 0 0;
    padding: 10px 12px;
    max-width: 100%;
    font-size: 11.5px;
    line-height: 1.6;
    text-align: left;
    color: #8a5a52;
    background: #fdf6f4;
    border: 1px dashed #eed3cd;
    border-radius: 8px;
    word-break: break-all;
    white-space: pre-wrap;
  }

  .empty p { max-width: 46ch; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 12px);
    background: #1c1b18;
    color: #fff;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: all .22s;
    z-index: 20;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer.meta {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    color: #a29b8e;
  }

  @media (max-width: 860px) {
    .shell { padding: 28px 16px 56px; }
    .grid { grid-template-columns: 1fr; }
    .panel-form { position: static; }
    .out-body { padding: 22px 18px 24px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="eyebrow"><span class="dot"></span>AI 起名工作台</span>
    <h1>说出需求，<span class="accent">三组名字</span>当场写好寓意</h1>
    <p class="sub">描述用途、风格、性别、行业或忌用字，AI 会边想边写，逐字流式输出，并自动把方案存档到数据库。</p>
  </header>

  <div class="grid">
    <!-- 左：输入 -->
    <section class="panel panel-form">
      <form id="form" autocomplete="off">
        <label class="field-label" for="modelSelect">
          <span>模型</span>
          <span class="api-badge" id="apiBadge">Responses API</span>
        </label>
        <div class="select-wrap">
          <select id="modelSelect" name="modelKey">
            <option value="doubao">豆包 Seed 2.1 Pro</option>
            <option value="deepseek">DeepSeek V4.1 Flash</option>
            <option value="qwen">通义千问 Plus</option>
            <option value="kimi">Kimi K3.1 Pro</option>
          </select>
          <span class="select-arrow" aria-hidden="true"></span>
        </div>

        <label class="field-label" for="requirement" style="margin-top: 18px;">
          <span>起名需求</span>
          <span class="counter" id="counter">0 / 300</span>
        </label>
        <textarea
          id="requirement"
          name="requirement"
          maxlength="300"
          placeholder="例如：给一家主打手冲咖啡的小店起名，开在成都老街，希望有慢生活的感觉，忌用「咖啡」两个字。"
        ></textarea>

        <div class="chips" id="chips">
          <button type="button" class="chip">给男孩起名，姓陈，文气一点</button>
          <button type="button" class="chip">美妆品牌，中文名 + 英文感</button>
          <button type="button" class="chip">宠物猫，橘猫，要俏皮</button>
        </div>

        <div class="actions">
          <button class="primary" id="submitBtn" type="submit">
            <span id="btnLabel">开始起名</span>
          </button>
          <button class="ghost" id="stopBtn" type="button" disabled>停止</button>
        </div>

        <div class="hint">
          <b>提示：</b>需求越具体，方案越准。可写清用途、姓氏/行业、风格（古风 · 简洁 · 谐音趣味）、字数限制、避讳字。<br />
          <b>输出：</b>3 组方案，每组含名字 + 寓意解读 + 风格标签。
        </div>
      </form>
    </section>

    <!-- 右：输出 -->
    <section class="panel panel-out">
      <div class="out-head">
        <span class="out-title">命名方案</span>
        <span class="status" id="status"><span class="dot"></span><span id="statusText">待开始</span></span>
      </div>

      <div class="out-body">
        <div class="empty" id="empty">
          <div class="empty-mark">名</div>
          <p>还没有方案。选好模型、写下需求，点击「开始起名」。</p>
        </div>
        <div id="output"></div>
      </div>

      <div class="out-foot" id="foot">
        <span id="footInfo"></span>
        <div class="foot-actions">
          <button class="mini" id="copyBtn" type="button">复制</button>
          <button class="mini" id="downloadBtn" type="button">下载 .md</button>
        </div>
      </div>
    </section>
  </div>

  <footer class="meta">流式生成 · 方案自动入库 Supabase · 密钥仅存于服务端环境变量</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const form = document.getElementById('form');
  const input = document.getElementById('requirement');
  const counter = document.getElementById('counter');
  const submitBtn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const emptyEl = document.getElementById('empty');
  const outputEl = document.getElementById('output');
  const footEl = document.getElementById('foot');
  const footInfo = document.getElementById('footInfo');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const toastEl = document.getElementById('toast');
  const modelSelect = document.getElementById('modelSelect');
  const apiBadge = document.getElementById('apiBadge');

  let controller = null;
  let fullText = '';
  let running = false;
  let startedAt = 0;
  let model = '';
  let modelLabel = '';
  let finished = null;
  let modelMap = {};

  // --- 工具 ---
  const escapeHtml = (s) =>
    s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function inline(text) {
    let s = escapeHtml(text);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/`([^`]+)`/g, '<strong>$1</strong>');
    return s;
  }

  /** 极简 Markdown 渲染：标题 / 段落 / 列表 / 粗体 */
  function renderMarkdown(md) {
    const lines = md.split('\n');
    let html = '';
    let buffer = [];
    let listItems = '';

    const closeBlocks = () => {
      if (listItems) { html += '<ul>' + listItems + '</ul>'; listItems = ''; }
      if (buffer.length) { html += '<p>' + buffer.map(inline).join('<br />') + '</p>'; buffer = []; }
    };

    for (const raw of lines) {
      const trimmed = raw.replace(/\s+$/, '').trim();

      if (!trimmed) { closeBlocks(); continue; }

      const h = trimmed.match(/^#{1,4}\s+(.*)$/);
      if (h) { closeBlocks(); html += '<h3>' + inline(h[1]) + '</h3>'; continue; }

      const li = trimmed.match(/^(?:[-*·•]|\d+[.、)])\s+(.*)$/);
      if (li) {
        if (buffer.length) { html += '<p>' + buffer.map(inline).join('<br />') + '</p>'; buffer = []; }
        listItems += '<li>' + inline(li[1]) + '</li>';
        continue;
      }

      if (listItems) { html += '<ul>' + listItems + '</ul>'; listItems = ''; }
      buffer.push(trimmed);
    }

    closeBlocks();
    return html;
  }

  function paint(withCursor) {
    outputEl.innerHTML = renderMarkdown(fullText) + (withCursor ? '<span class="cursor"></span>' : '');
  }

  function setStatus(kind, text) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusText.textContent = text;
  }

  function setRunning(on) {
    running = on;
    submitBtn.disabled = on;
    stopBtn.disabled = !on;
    modelSelect.disabled = on;
    btnLabel.textContent = on ? '生成中…' : '开始起名';
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // --- 模型下拉框：优先用 /api/name 返回的配置表渲染 ---
  function syncApiBadge() {
    const item = modelMap[modelSelect.value];
    const api = item ? item.api : 'responses';
    const ready = item ? item.ready !== false : true;
    apiBadge.textContent = (api === 'chat' ? 'Chat Completions' : 'Responses API') + (ready ? '' : ' · 未配置密钥');
    apiBadge.classList.toggle('warn', !ready);
  }

  async function loadModels() {
    try {
      const resp = await fetch('/api/name');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      if (!data || !Array.isArray(data.models) || !data.models.length) throw new Error('空列表');

      modelMap = {};
      modelSelect.innerHTML = '';
      for (const m of data.models) {
        modelMap[m.key] = m;
        const opt = document.createElement('option');
        opt.value = m.key;
        opt.textContent = m.label + (m.ready === false ? '（未配置密钥）' : '');
        modelSelect.appendChild(opt);
      }
      if (data.defaultModelKey && modelMap[data.defaultModelKey]) {
        modelSelect.value = data.defaultModelKey;
      }
    } catch (_) {
      // 拿不到配置就用页面里的静态选项兜底
      for (const opt of modelSelect.options) {
        modelMap[opt.value] = { key: opt.value, api: 'responses', ready: true };
      }
    }
    syncApiBadge();
  }

  modelSelect.addEventListener('change', syncApiBadge);
  loadModels();

  // --- 输入计数 ---
  input.addEventListener('input', () => {
    counter.textContent = input.value.length + ' / 300';
  });

  document.getElementById('chips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    input.value = chip.textContent.trim();
    input.dispatchEvent(new Event('input'));
    input.focus();
  });

  // --- 提交 ---
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (running) return;

    const requirement = input.value.trim();
    if (!requirement) {
      toast('请先写下起名需求');
      input.focus();
      return;
    }

    fullText = '';
    model = '';
    modelLabel = '';
    finished = null;
    startedAt = Date.now();
    outputEl.innerHTML = '';
    emptyEl.style.display = 'none';
    footEl.classList.remove('show');
    setRunning(true);
    setStatus('live', '正在生成');

    const modelKey = modelSelect.value;
    const picked = modelMap[modelKey];
    modelLabel = picked ? picked.label : modelSelect.selectedOptions[0].textContent;

    controller = new AbortController();

    try {
      const resp = await fetch('/api/name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requirement, modelKey }),
        signal: controller.signal,
      });

      if (!resp.ok) {
        let message = '请求失败（HTTP ' + resp.status + '）';
        try {
          const data = await resp.json();
          if (data && data.error) message = data.error;
        } catch (_) {}
        throw new Error(message);
      }
      if (!resp.body) throw new Error('当前环境不支持流式读取');

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      paint(true);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true }).replace(/\r/g, '');
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop() || '';

        for (const block of blocks) {
          let event = 'message';
          let dataStr = '';
          for (const line of block.split('\n')) {
            const t = line.trim();
            if (t.startsWith('event:')) event = t.slice(6).trim();
            else if (t.startsWith('data:')) dataStr += t.slice(5).trim();
          }
          if (!dataStr) continue;
          let data;
          try { data = JSON.parse(dataStr); } catch (_) { continue; }

          if (event === 'meta') {
            model = data.model || '';
            modelLabel = data.label || modelLabel;
            startedAt = data.startedAt || startedAt;
            setStatus('live', '正在生成 · ' + modelLabel);
          } else if (event === 'delta' && data.text) {
            fullText += data.text;
            paint(true);
          } else if (event === 'error') {
            const err = new Error(data.message || '生成失败');
            err.code = data.code || '';
            err.detail = data.detail || '';
            err.modelLabel = data.label || modelLabel;
            throw err;
          } else if (event === 'done') {
            finished = data;
          }
        }
      }
    } catch (err) {
      const aborted = err && (err.name === 'AbortError');
      setRunning(false);
      if (aborted) {
        setStatus('', '已停止 · ' + fullText.length + ' 字');
        if (fullText) paint(false);
        return;
      }
      setStatus('err', '出错了');
      emptyEl.style.display = '';
      // 已知错误只展示可读结论；未知错误再把原始技术详情折叠出来
      const detail = err.detail && !err.code
        ? '<p class="tech-detail">' + escapeHtml(err.detail) + '</p>'
        : '';
      emptyEl.innerHTML =
        '<div class="empty-mark" style="background:#fdf3f1;border-color:#eed3cd;color:#a3342a">!</div>' +
        '<p>' + escapeHtml(err.message || '生成失败，请稍后重试') + '</p>' + detail;
      outputEl.innerHTML = '';
      toast('生成失败，看看右侧提示');
      return;
    }

    // 正常结束
    setRunning(false);
    paint(false);

    const seconds = startedAt ? Math.max(0.1, (Date.now() - startedAt) / 1000) : 0;
    setStatus('', '完成 · ' + seconds.toFixed(1) + 's');

    footEl.classList.add('show');
    const bits = [];
    if (modelLabel) bits.push(modelLabel);
    if (model && model !== modelLabel) bits.push(model);
    bits.push(fullText.length + ' 字');
    if (finished) {
      if (finished.modelTag) bits.push(finished.modelTag);
      bits.push(finished.saved ? '已存入 Supabase' : '未入库');
      if (finished.warning) bits.push(finished.warning);
    }
    footInfo.textContent = bits.join(' · ');
    if (finished && finished.warning) {
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = '注意：' + finished.warning;
      outputEl.prepend(banner);
    }
  });

  stopBtn.addEventListener('click', () => {
    if (controller) controller.abort();
  });

  // --- 复制 / 下载 ---
  copyBtn.addEventListener('click', async () => {
    if (!fullText) return;
    try {
      await navigator.clipboard.writeText(fullText);
      toast('已复制到剪贴板');
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = fullText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('已复制到剪贴板');
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!fullText) return;
    const stamp = new Date().toISOString().slice(0, 10);
    const blob = new Blob([fullText], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '起名方案-' + stamp + '.md';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      document.body.removeChild(a);
    }, 0);
  });

})();
</script>
</body>
</html>
